<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 826" width="1400" height="826" role="img" aria-label="GTS AI SDLC architecture — a 3-tier composition model, read top to bottom in five lanes. A developer request first passes through gts-prompt-clarifier, which resolves ambiguity and enriches context. Tier 1, the gts-orchestrator, knows every registered system and routes the request to the right orchestrator, never implementing anything itself. Tier 2 is the p7-orchestrator (P7 Pricing and Risk, a linear TDD pipeline) and the t7-orchestrator (T7 Trading System, an autonomous Ralph loop). Tier 3 is eight to nine single-purpose pipeline agents — planner, architect, developer, tester, reviewer, builder, pr-author, spec-author and (T7) knowledge — each doing one job and ending its turn with a status code; only the developer writes code. All agents draw on shared skills: 15 common skills plus system skills, reusable and vendor-neutral across VS Code, Codex and the CLI. Each skill wraps an MCP server — code-review-lens wraps codereviewer-lens, t7-code wraps t7codebase, t7-spec wraps t7spec, github wraps github, jira wraps devops_jira — and agents reach those servers only through the skill, never directly.">
  <title>GTS AI SDLC — three tiers, composed</title>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#B9BFC8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="826" fill="#FFFFFF"/>

  <g font-family="Inter, 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- ============ header ============ -->
    <text x="44" y="52" font-size="15" font-weight="700" fill="#8A92A0" letter-spacing="2">ARCHITECTURE AT A GLANCE</text>
    <text x="44" y="88" font-size="28" font-weight="700" fill="#1A1A2E" letter-spacing="-0.4">Three tiers, composed</text>
    <text x="44" y="115" font-size="15" font-weight="500" fill="#5B6472">A generic router on top, one orchestrator per system in the middle, single-purpose agents below — all drawing on shared skills.</text>
    <line x1="44" y1="134" x2="1356" y2="134" stroke="#ECECEC" stroke-width="1"/>

    <!-- ============ tier lanes (behind everything) ============ -->
    <g>
      <rect x="130" y="196" width="1220" height="150" rx="18" fill="#F6F3FC"/>
      <rect x="130" y="362" width="1220" height="110" rx="18" fill="#F0F5FC"/>
      <rect x="130" y="488" width="1220" height="150" rx="18" fill="#EEF7F5"/>
      <rect x="130" y="652" width="1220" height="74"  rx="18" fill="#FBF6EC"/>
      <rect x="130" y="742" width="1220" height="70"  rx="18" fill="#F2F4F7"/>
    </g>

    <!-- ============ left tier rail ============ -->
    <g>
      <line x1="92" y1="214" x2="92" y2="800" stroke="#E4E7EC" stroke-width="1.5"/>
      <circle cx="92" cy="271" r="5" fill="#6E5BB8"/>
      <text transform="translate(64,271) rotate(-90)" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6E5BB8">TIER 1</text>
      <circle cx="92" cy="417" r="5" fill="#3F6FB5"/>
      <text transform="translate(64,417) rotate(-90)" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#3F6FB5">TIER 2</text>
      <circle cx="92" cy="563" r="5" fill="#2E8E84"/>
      <text transform="translate(64,563) rotate(-90)" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#2E8E84">TIER 3</text>
      <circle cx="92" cy="689" r="5" fill="#C2862B"/>
      <text transform="translate(64,689) rotate(-90)" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#C2862B">SKILLS</text>
      <circle cx="92" cy="777" r="5" fill="#5B6472"/>
      <text transform="translate(64,777) rotate(-90)" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#5B6472">MCP</text>
    </g>

    <!-- ============ flow connectors ============ -->
    <g fill="none" stroke="#B9BFC8" stroke-width="2">
      <line x1="740" y1="184" x2="740" y2="204" marker-end="url(#arw)"/>
      <line x1="740" y1="258" x2="740" y2="270" marker-end="url(#arw)"/>
      <!-- tier1 -> split -->
      <path d="M740 336 L740 350"/>
      <path d="M445 350 L1035 350"/>
      <line x1="445" y1="350" x2="445" y2="372" marker-end="url(#arw)"/>
      <line x1="1035" y1="350" x2="1035" y2="372" marker-end="url(#arw)"/>
      <!-- tier2 -> converge -->
      <path d="M445 462 L445 476"/>
      <path d="M1035 462 L1035 476"/>
      <path d="M445 476 L1035 476"/>
      <line x1="740" y1="476" x2="740" y2="488" marker-end="url(#arw)"/>
      <!-- tier3 -> skills -->
      <line x1="740" y1="638" x2="740" y2="652" marker-end="url(#arw)"/>
    </g>

    <!-- ============ entry request ============ -->
    <rect x="640" y="150" width="200" height="34" rx="17" fill="#F4F6F8" stroke="#E1E5EA"/>
    <text x="740" y="172" text-anchor="middle" font-size="13.5" font-weight="600" fill="#46505E">Developer request</text>

    <!-- ============ TIER 1 · clarifier + orchestrator ============ -->
    <g>
      <rect x="510" y="206" width="460" height="52" rx="13" fill="#FFFFFF" stroke="#E6E1F2"/>
      <circle cx="540" cy="232" r="14" fill="#ECE7FA"/>
      <g transform="translate(540,232)" fill="none" stroke="#6E5BB8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
        <path d="M-7 -5 h14 a2 2 0 0 1 2 2 v6 a2 2 0 0 1 -2 2 h-9 l-5 4 v-4 a2 2 0 0 1 -2 -2 v-6 a2 2 0 0 1 2 -2 z"/>
      </g>
      <text x="568" y="229" font-size="15" font-weight="700" fill="#2B3242">gts-prompt-clarifier</text>
      <text x="568" y="247" font-size="11.5" fill="#8A92A0">resolves ambiguity · enriches context before routing</text>
    </g>

    <g>
      <rect x="440" y="272" width="600" height="64" rx="15" fill="#FFFFFF" stroke="#DFD6F4"/>
      <rect x="440" y="272" width="6" height="64" rx="3" fill="#6E5BB8"/>
      <circle cx="484" cy="304" r="18" fill="#ECE7FA" stroke="#C9BEEC" stroke-width="1.2"/>
      <g transform="translate(484,304)" stroke="#6E5BB8" fill="#6E5BB8">
        <circle cx="0" cy="-9" r="3.1" stroke="none"/>
        <g fill="none" stroke-width="2" stroke-linecap="round">
          <path d="M0 -6 C0 0 -10 0 -10 5"/>
          <path d="M0 -6 L0 5"/>
          <path d="M0 -6 C0 0 10 0 10 5"/>
        </g>
        <circle cx="-10" cy="8" r="2.5" stroke="none"/>
        <circle cx="0" cy="8" r="2.5" stroke="none"/>
        <circle cx="10" cy="8" r="2.5" stroke="none"/>
      </g>
      <text x="518" y="298" font-size="17" font-weight="700" fill="#1F2733">gts-orchestrator</text>
      <text x="518" y="320" font-size="12.5" fill="#5B6472">Knows every system · <tspan font-weight="700" fill="#3A4150">routes</tspan> to the right orchestrator · never implements</text>
    </g>

    <!-- ============ TIER 2 · systems ============ -->
    <g>
      <rect x="210" y="372" width="470" height="90" rx="15" fill="#FFFFFF" stroke="#D9E2F1"/>
      <rect x="234" y="396" width="42" height="42" rx="11" fill="#3F6FB5"/>
      <text x="255" y="423" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">P7</text>
      <text x="292" y="404" font-size="16.5" font-weight="700" fill="#1F2733">p7-orchestrator</text>
      <text x="292" y="426" font-size="12" fill="#5B6472">Pricing &amp; Risk · <tspan font-weight="700" fill="#3A4150">linear TDD pipeline</tspan></text>
      <text x="292" y="446" font-size="10.5" fill="#9AA1AB">Plan → Architect → Gate → RED → GREEN → Review → Build → PR</text>
    </g>

    <g>
      <rect x="800" y="372" width="470" height="90" rx="15" fill="#FFFFFF" stroke="#D9E2F1"/>
      <rect x="824" y="396" width="42" height="42" rx="11" fill="#3F6FB5"/>
      <text x="845" y="423" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">T7</text>
      <text x="882" y="404" font-size="16.5" font-weight="700" fill="#1F2733">t7-orchestrator</text>
      <text x="882" y="426" font-size="12" fill="#5B6472">Trading System · <tspan font-weight="700" fill="#3A4150">autonomous Ralph loop</tspan></text>
      <text x="882" y="446" font-size="10.5" fill="#9AA1AB">specs → plan → gate → build loop, one task per iteration</text>
    </g>

    <!-- ============ TIER 3 · pipeline agents ============ -->
    <g>
      <text x="160" y="516" font-size="14" font-weight="700" fill="#1F2733">Pipeline agents — one job each, every turn ends with a <tspan fill="#2E8E84">status code</tspan></text>
      <text x="1320" y="516" text-anchor="end" font-size="11.5" font-style="italic" fill="#7E8694">only the developer writes code</text>

      <!-- row 1 -->
      <g font-size="12.5" font-weight="600" text-anchor="middle">
        <g><rect x="160"  y="528" width="200" height="30" rx="8" fill="#FFFFFF" stroke="#CFE9E5"/><text x="260"  y="548" fill="#2E7D74">planner</text></g>
        <g><rect x="400"  y="528" width="200" height="30" rx="8" fill="#FFFFFF" stroke="#CFE9E5"/><text x="500"  y="548" fill="#2E7D74">architect</text></g>
        <g><rect x="640"  y="528" width="200" height="30" rx="8" fill="#E3F3E8" stroke="#8CCB9F"/><text x="740"  y="548" fill="#2F7A4F">developer ✎</text></g>
        <g><rect x="880"  y="528" width="200" height="30" rx="8" fill="#FFFFFF" stroke="#CFE9E5"/><text x="980"  y="548" fill="#2E7D74">tester</text></g>
        <g><rect x="1120" y="528" width="200" height="30" rx="8" fill="#FFFFFF" stroke="#CFE9E5"/><text x="1220" y="548" fill="#2E7D74">reviewer</text></g>
      </g>
      <!-- row 2 -->
      <g font-size="12.5" font-weight="600" text-anchor="middle">
        <g><rect x="280"  y="566" width="200" height="30" rx="8" fill="#FFFFFF" stroke="#CFE9E5"/><text x="380"  y="586" fill="#2E7D74">builder</text></g>
        <g><rect x="520"  y="566" width="200" height="30" rx="8" fill="#FFFFFF" stroke="#CFE9E5"/><text x="620"  y="586" fill="#2E7D74">pr-author</text></g>
        <g><rect x="760"  y="566" width="200" height="30" rx="8" fill="#FFFFFF" stroke="#CFE9E5"/><text x="860"  y="586" fill="#2E7D74">spec-author</text></g>
        <g><rect x="1000" y="566" width="200" height="30" rx="8" fill="#FFFFFF" stroke="#CFE9E5"/><text x="1100" y="586" fill="#2E7D74">knowledge · T7</text></g>
      </g>
    </g>

    <!-- ============ SKILLS (wrappers) → MCP SERVERS ============ -->
    <text x="160" y="672" font-size="12.5" fill="#5B6472"><tspan font-weight="700" fill="#1F2733">Skill-first access</tspan> — each skill wraps an MCP server; agents never call a tool directly. Knowledge-only skills (coding-guidelines · spec-authoring · ralph-loop · requirement-conformance) need no MCP.</text>

    <!-- skill → MCP arrows -->
    <g fill="none" stroke="#B9BFC8" stroke-width="1.8">
      <line x1="260"  y1="716" x2="260"  y2="762" marker-end="url(#arw)"/>
      <line x1="505"  y1="716" x2="505"  y2="762" marker-end="url(#arw)"/>
      <line x1="750"  y1="716" x2="750"  y2="762" marker-end="url(#arw)"/>
      <line x1="995"  y1="716" x2="995"  y2="762" marker-end="url(#arw)"/>
      <line x1="1240" y1="716" x2="1240" y2="762" marker-end="url(#arw)"/>
    </g>

    <!-- skill chips (wrappers) -->
    <g font-size="11.5" font-weight="600" text-anchor="middle" fill="#9A6A1E">
      <g><rect x="185"  y="688" width="150" height="26" rx="13" fill="#FFFFFF" stroke="#EFE0C2"/><text x="260"  y="705">code-review-lens</text></g>
      <g><rect x="457"  y="688" width="96"  height="26" rx="13" fill="#FFFFFF" stroke="#EFE0C2"/><text x="505"  y="705">t7-code</text></g>
      <g><rect x="705"  y="688" width="90"  height="26" rx="13" fill="#FFFFFF" stroke="#EFE0C2"/><text x="750"  y="705">t7-spec</text></g>
      <g><rect x="947"  y="688" width="96"  height="26" rx="13" fill="#FFFFFF" stroke="#EFE0C2"/><text x="995"  y="705">github</text></g>
      <g><rect x="1202" y="688" width="76"  height="26" rx="13" fill="#FFFFFF" stroke="#EFE0C2"/><text x="1240" y="705">jira</text></g>
    </g>

    <!-- MCP server chips (the raw namespaces the skills wrap) -->
    <g font-size="11.5" font-weight="600" text-anchor="middle" font-family="'SF Mono', ui-monospace, Menlo, monospace" fill="#46505E">
      <g><rect x="176"  y="764" width="168" height="28" rx="8" fill="#FFFFFF" stroke="#D9DEE5"/><text x="260"  y="782">codereviewer-lens</text></g>
      <g><rect x="445"  y="764" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D9DEE5"/><text x="505"  y="782">t7codebase</text></g>
      <g><rect x="707"  y="764" width="86"  height="28" rx="8" fill="#FFFFFF" stroke="#D9DEE5"/><text x="750"  y="782">t7spec</text></g>
      <g><rect x="947"  y="764" width="96"  height="28" rx="8" fill="#FFFFFF" stroke="#D9DEE5"/><text x="995"  y="782">github</text></g>
      <g><rect x="1175" y="764" width="130" height="28" rx="8" fill="#FFFFFF" stroke="#D9DEE5"/><text x="1240" y="782">devops_jira</text></g>
    </g>

  </g>
</svg>
