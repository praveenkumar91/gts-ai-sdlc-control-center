<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 628" width="1500" height="628" role="img" aria-label="GTS AI SDLC systems and skills. Two systems today. P7, the Pricing and Risk Management platform, runs the p7-orchestrator over a linear TDD pipeline with eight roles — planner, architect, developer, tester, reviewer, builder, pr-author, spec-author — and six system skills: p7-code, p7-code-review, p7-debugging, p7-brainstorming, p7-verification, p7-github. T7, the Trading System, runs the t7-orchestrator as an autonomous Ralph loop with the same eight roles plus a read-only knowledge agent, and four system skills: t7-code, t7-code-review, t7-spec, t7-knowledge-base. The shared skill library groups review and specs (code-review-lens, code-review, requirement-conformance, spec-authoring, coding-guidelines), integrations (github, github-pr-miner, jira, confluence, teams) and SDLC discipline (ralph-loop, sdlc-brainstorming, sdlc-debugging, sdlc-verification). Totals: 21 agents, 25 skills (15 common plus 10 system), 2 systems, 8 pipeline phases.">
  <title>GTS AI SDLC — systems &amp; the shared skill library</title>

  <rect x="0" y="0" width="1500" height="628" fill="#FFFFFF"/>

  <g font-family="Inter, 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- header -->
    <text x="44" y="56" font-size="15" font-weight="700" fill="#8A92A0" letter-spacing="2">SYSTEMS &amp; SKILLS</text>
    <text x="44" y="92" font-size="28" font-weight="700" fill="#1A1A2E" letter-spacing="-0.4">Two systems, composed from shared skills</text>
    <text x="44" y="120" font-size="15" font-weight="500" fill="#5B6472">Each system binds the same lifecycle to its own agents and reuses the common skill library — onboarding a new one is copy-and-fill.</text>
    <line x1="44" y1="140" x2="1456" y2="140" stroke="#ECECEC" stroke-width="1"/>

    <!-- column labels -->
    <text x="44" y="172" font-size="12" font-weight="700" fill="#8A92A0" letter-spacing="1.4">SUPPORTED SYSTEMS</text>
    <text x="770" y="172" font-size="12" font-weight="700" fill="#8A92A0" letter-spacing="1.4">THE SHARED SKILL LIBRARY</text>

    <!-- ============ P7 card ============ -->
    <g>
