      <line x1="796" y1="454" x2="1430" y2="454" stroke="#EEF0F2"/>
      <text x="796" y="482" font-size="12.5" fill="#5B6472"><tspan font-weight="700" fill="#3A4150">System skills</tspan> extend the base per system — 6 for P7, 4 for T7.</text>
      <text x="796" y="504" font-size="12" fill="#9AA1AB">Reached through a skill, never a raw MCP call · reusable across VS Code · Codex · CLI.</text>
