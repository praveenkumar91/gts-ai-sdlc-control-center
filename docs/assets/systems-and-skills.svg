<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 672" width="1500" height="672" role="img" aria-label="GTS AI SDLC systems and skills. Two systems today, each with its own read-only knowledge agent. P7, the Pricing and Risk Management platform, runs the p7-orchestrator over a linear TDD pipeline with eight roles — planner, architect, developer, tester, reviewer, builder, pr-author, spec-author — plus a read-only p7-sdlc-knowledge agent, and seven system skills: p7-code, p7-code-review, p7-debugging, p7-brainstorming, p7-verification, p7-github, p7-spec. T7, the Trading System, runs the t7-orchestrator as an autonomous Ralph loop with the same eight roles plus a read-only knowledge agent, and five system skills: t7-code, t7-code-review, t7-spec, t7-knowledge-base, t7-refdata. The shared skill library groups review and specs (code-review-lens, code-review, requirement-conformance, spec-authoring, coding-guidelines, document-rendering), integrations (github, github-pr-miner, jira, confluence, teams, gcp-tools), SDLC discipline (ralph-loop, sdlc-brainstorming, sdlc-debugging, sdlc-verification) and delivery and build (gts-delivery, gts-build-graph), plus four issue-analysis skills (build-failure-lens, sonar-finding-lens, security-alert-triage, issue-triage) used by the read-only gts-issue-analyst and gts-delivery peers. Totals: 24 agents, 34 skills (22 common plus 12 system), 2 systems, 8 pipeline phases.">
  <title>GTS AI SDLC — systems &amp; the shared skill library</title>

  <rect x="0" y="0" width="1500" height="672" fill="#FFFFFF"/>

  <g font-family="Inter, 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- header -->
    <text x="44" y="56" font-size="15" font-weight="700" fill="#8A92A0" letter-spacing="2">SYSTEMS &amp; SKILLS</text>
    <text x="44" y="92" font-size="28" font-weight="700" fill="#1A1A2E" letter-spacing="-0.4">Two systems, composed from shared skills</text>
    <text x="44" y="120" font-size="15" font-weight="500" fill="#5B6472">Each system binds the same lifecycle to its own agents and reuses the common skill library — onboarding a new one is copy-and-fill.</text>
    <line x1="44" y1="140" x2="1456" y2="140" stroke="#ECECEC" stroke-width="1"/>

    <!-- column labels -->
    <text x="44" y="172" font-size="12" font-weight="700" fill="#8A92A0" letter-spacing="1.4">SUPPORTED SYSTEMS</text>
    <text x="770" y="172" font-size="12" font-weight="700" fill="#8A92A0" letter-spacing="1.4">THE SHARED SKILL LIBRARY</text>

