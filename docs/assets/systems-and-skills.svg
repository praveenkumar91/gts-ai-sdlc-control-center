      <text x="128" y="245" font-size="12.5" fill="#5B6472">Pricing &amp; Risk Management · <tspan font-weight="700" fill="#3A4150">linear TDD pipeline</tspan></text>
      <line x1="70" y1="268" x2="704" y2="268" stroke="#EEF0F2"/>
      <text x="70" y="292" font-size="10.5" font-weight="700" fill="#B6BCC4" letter-spacing="1">ROLES</text>
